<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e31b23"><title>Catálogo Altas Horas</title><style>
:root{--r:#e31b23;--bg:#07090c;--card:#111820;--line:#26313d;--muted:#9aa8b5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.wrap{max-width:720px;margin:auto;padding:22px 14px 110px}.logo{font-size:25px;font-weight:900}.logo b{color:var(--r)}.hero{padding:24px 0}.hero h1{font-size:32px;margin:8px 0}.muted{color:var(--muted)}input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#0b1117;color:#fff;font-size:16px}.chips{display:flex;gap:7px;overflow:auto;padding:12px 0}.chip{white-space:nowrap;background:#18222d;border:0;color:#fff;padding:9px 12px;border-radius:20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.price{font-size:20px;font-weight:800;margin:8px 0}.add,.whats{border:0;background:var(--r);color:#fff;padding:11px;border-radius:10px;font-weight:800;width:100%}.cart{position:fixed;bottom:0;left:0;right:0;background:#101820;border-top:1px solid var(--line);padding:10px}.cartin{max-width:720px;margin:auto;display:flex;gap:10px;align-items:center}.cartin div{flex:1}@media(max-width:430px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="logo">ALTAS <b>HORAS</b></div><div class="hero"><div class="muted">Borracharia • Pneus • Serviços</div><h1>Catálogo</h1><p class="muted">Escolha produtos e serviços e envie seu pedido pelo WhatsApp.</p></div><input id="busca" placeholder="Buscar produto ou serviço"><div id="chips" class="chips"></div><div id="grid" class="grid"></div></div><div class="cart"><div class="cartin"><div><b id="qtd">0 itens</b><br><span id="total">R$ 0,00</span></div><button class="whats" id="pedir">Pedir no WhatsApp</button></div></div><script>
const URL='https://vyzukumcubhjysxlvuia.supabase.co',KEY='sb_publishable_i3CovVNZTbgo4E2nHOm__A_uCoYqJkd',loja=new URLSearchParams(location.search).get('loja');let itens=[],cart=[],cat='Todos',whats='';
const $=x=>document.getElementById(x),money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){if(!loja){$('grid').innerHTML='<div class="card">Link do catálogo inválido.</div>';return}let r=await fetch(URL+'/rest/v1/rpc/catalogo_publico',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({p_user:loja})});itens=await r.json();let c=['Todos',...new Set(itens.map(x=>x.categoria||'Outros'))];$('chips').innerHTML=c.map(x=>'<button class="chip" onclick="cat=\''+String(x).replace(/'/g,"\\'")+'\';render()">'+esc(x)+'</button>').join('');try{let q=await fetch(URL+'/rest/v1/rpc/whatsapp_catalogo_publico',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({p_user:loja})});whats=(await q.json())||''}catch(e){}render()}
function render(){let q=$('busca').value.toLowerCase(),a=itens.filter(x=>(cat==='Todos'||(x.categoria||'Outros')===cat)&&(x.nome.toLowerCase().includes(q)||(x.descricao||'').toLowerCase().includes(q)));$('grid').innerHTML=a.map(x=>'<div class="card"><small class="muted">'+esc(x.categoria||x.tipo)+'</small><h3>'+esc(x.nome)+'</h3><div class="muted">'+esc(x.descricao||'')+'</div><div class="price">'+money(x.preco)+'</div><button class="add" onclick="add(\''+x.id+'\')">Adicionar</button></div>').join('')||'<div class="card">Nenhum item encontrado.</div>'}
function add(id){let x=itens.find(a=>a.id===id),z=cart.find(a=>a.id===id);z?z.q++:cart.push({...x,q:1});update()}function update(){let q=cart.reduce((a,x)=>a+x.q,0),t=cart.reduce((a,x)=>a+x.q*+x.preco,0);$('qtd').textContent=q+' item(ns)';$('total').textContent=money(t)}
$('busca').oninput=render;$('pedir').onclick=()=>{if(!cart.length)return alert('Adicione algum item.');let msg='Olá! Vim pelo catálogo Altas Horas e quero:%0A%0A'+cart.map(x=>'• '+x.q+'x '+x.nome+' — '+money(x.q*x.preco)).join('%0A')+'%0A%0ATotal estimado: '+money(cart.reduce((a,x)=>a+x.q*+x.preco,0));let dest=whats?('https://wa.me/'+whats+'?text='+msg):('https://wa.me/?text='+msg);location.href=dest};load();
</script></body></html>
